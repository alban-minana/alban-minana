name: snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake.svg?palette=github-dark&color_snake=#c2d0ff&color_dots=#161616,#0b1f6b,#1238c4,#2a5bff,#8fa8ff

      - name: Commit the snake
        run: |
          git config user.name "Alban Minana"
          git config user.email "86537381+alban-minana@users.noreply.github.com"
          git add assets/snake.svg
          git diff --cached --quiet || git commit -m "chore: refresh snake"
          git push
