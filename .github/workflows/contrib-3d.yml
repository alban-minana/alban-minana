name: contrib-3d

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/3d-contrib.json

      - name: Commit the graph
        run: |
          git config user.name "Alban Minana"
          git config user.email "86537381+alban-minana@users.noreply.github.com"
          mkdir -p assets && mv profile-3d-contrib/contrib-3d.svg assets/contrib-3d.svg && rm -rf profile-3d-contrib
          git add assets/contrib-3d.svg
          git diff --cached --quiet || git commit -m "chore: refresh 3D contribution graph"
          git push
